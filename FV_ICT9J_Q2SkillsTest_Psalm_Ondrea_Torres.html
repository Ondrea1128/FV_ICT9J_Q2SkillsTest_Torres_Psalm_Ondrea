<h2 class="text-center bg-light col-lg-7 p-4 rounded">OBMC Enrollment Form</h2>
<br>
<br>
<div class="row justify-content-center">
  <div class="col-lg-7 bg-light p-4 rounded">
    <h4>Student Information</h4>
    <br>
    <form>
  <label for="fname" style="color: rgb(0, 0, 0);">First name:</label>
  <input type="text" id="fname" name="fname" placeholder="Mary"required>
  <label for="lname" style="color: rgb(0, 0, 0);">Last name:</label>
  <input type="text" id="lname" name="lname" placeholder="Grace"required>
  <label for="birthdate" style="color: rgb(0, 0, 0);">Birth Date:</label>
  <input type="date" id="birthdate" name="birthdate" value="birthdate"required>
  <br>
  <br>
  <label for="gender" style="color: rgb(0, 0, 0);">Gender</label>
  <br>
<label for="gender">Male</label>
<input type="radio" id="gender" name="gender" value="Male"required>
<label for="gender">Female</label>
<input type="radio" id="gender" name="gender" value="Female"required>
<br><br>
<h4>Contact Information</h4>
<label for="email" style="color: rgb(0, 0, 0);">Email Address</label>
<input type="email" id="email" name="email" placeholder="exampleof@gmail.com"required>
<label for="contact" style="color: rgb(0, 0, 0);">Contact Number</label>
<input type="text" id="contact" name="contact" placeholder="0920-6767-6777"required>
<br>
<h4>Other Information</h4>
<input type="radio" id="modes" name="modes" value="Onsite"required>
<label for="modes">Onsite</label><br>
<input type="radio" id="modes" name="modes" value="Online"required>
<label for="modes">Online</label><br>
<input type="radio" id="modes" name="modes" value="Mixed"required>
<label for="modes">Mixed</label><br><br>
<input type="submit" value="Enroll">
</form>
